<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unity Backend Control</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
    body {
        font-family: system-ui, Arial;
        margin: 16px;
    }

    .controls {
        margin-bottom: 12px;
    }

    button {
        margin-right: 8px;
        padding: 8px 12px;
    }

    pre {
        background: #111;
        color: #eee;
        padding: 12px;
        height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
    }

    .status {
        margin-bottom: 8px;
        font-size: 90%;
        color: #333;
    }
</style>
</head>
<body>
  
  <div class="container hidden" id="controlPanel">
    <h2>Unity Backend Control Panel</h2>
    <div class="status" id="status">Loading status...</div>
    <div class="controls">
      <button class="btn-danger" id="stopBtn">Stop Server</button>
      <button class="btn-warning" id="restartBtn">Restart Server</button>
      <button class="btn-success" id="clearLogsBtn">Clear Logs</button>
      <button class="btn-primary" id="refreshLogsBtn">Refresh Logs</button>
    </div>
  <div>
    <h3>Logs</h3>
    <pre id="logs">Loading logs...</pre>
  </div>
  <div>
    <h3>Recent Errors</h3>
    <pre id="errors">Loading errors...</pre>
  </div>

  <script>
    async function fetchJSON(path, opts) {
      console.log(`Fetching ${path}...`, opts);
      try {
        const res = await fetch(path, opts);
        console.log(`Response from ${path}:`, res.status, res.statusText);
        const data = await res.json();
        console.log(`Data from ${path}:`, data);
        return data;
      } catch (e) {
        console.error(`Error fetching ${path}:`, e);
        return { error: String(e) };
      }
    }

    const statusEl = document.getElementById('status');
    const logsEl = document.getElementById('logs');
    const stopBtn = document.getElementById('stopBtn');
    const restartBtn = document.getElementById('restartBtn');
    const refreshLogsBtn = document.getElementById('refreshLogsBtn');
    const errorsEl = document.getElementById('errors');

    async function updateStatus() {
      const s = await fetchJSON('/control/status');
      if (s && s.pid) {
        statusEl.textContent = `PID: ${s.pid} | Uptime: ${Math.round(s.uptime)}s | Started: ${s.startedAt} | MongoDB: ${s.mongoConnected ? 'Connected' : 'Disconnected'}`;
        stopBtn.disabled = false;
        restartBtn.disabled = false;
      } else {
        statusEl.textContent = `Server not responding to /control/status.`;
        console.error('Status check failed:', s);
      }
    }

    async function loadLogs() {
      logsEl.textContent = 'Loading logs...';
      const j = await fetchJSON('/control/logs');
      if (j && j.logs !== undefined) {
        logsEl.textContent = j.logs || '(no logs)';
        logsEl.scrollTop = logsEl.scrollHeight;
        console.log(`Loaded ${j.count || 0} log entries`);
      } else {
        logsEl.textContent = 'Failed to load logs: ' + (j.error || JSON.stringify(j));
        console.error('Failed to load logs:', j);
      }
    }

    async function loadErrors() {
      errorsEl.textContent = 'Loading errors...';
      const j = await fetchJSON('/control/errors');
      if (j && Array.isArray(j.errors)) {
        if (j.errors.length === 0) {
          errorsEl.textContent = '(no recent errors)';
          console.log('No errors found');
        } else {
          errorsEl.textContent = j.errors.map(e => `${e.ts} [${e.level}] ${e.message}`).join('\n\n');
          errorsEl.scrollTop = errorsEl.scrollHeight;
          console.log(`Loaded ${j.errors.length} error entries`);
        }
      } else {
        errorsEl.textContent = 'Failed to load errors: ' + (j.error || JSON.stringify(j));
        console.error('Failed to load errors:', j);
      }
    }

    stopBtn.addEventListener('click', async () => {
      if (!confirm('Stop the server process? This will terminate the current Node process.')) return;
      console.log('Stop button clicked');
      stopBtn.disabled = true;
      restartBtn.disabled = true;
      const r = await fetchJSON('/control/stop', { method: 'POST' });
      console.log('Stop response:', r);
      alert(JSON.stringify(r));
    });

    restartBtn.addEventListener('click', async () => {
      if (!confirm('Restart server (spawn a new detached process)?')) return;
      console.log('Restart button clicked');
      stopBtn.disabled = true;
      restartBtn.disabled = true;
      const r = await fetchJSON('/control/restart', { method: 'POST' });
      console.log('Restart response:', r);
      alert(JSON.stringify(r));
    });

    clearLogsBtn.addEventListener('click', async () => {
      if (!confirm('Clear all logs and errors? This cannot be undone.')) return;
      console.log('Clear logs button clicked');
      clearLogsBtn.disabled = true;
      const r = await fetchJSON('/control/clearlogs', { method: 'POST' });
      console.log('Clear logs response:', r);
      clearLogsBtn.disabled = false;
      if (r.success) {
        loadLogs();
        loadErrors();
      } else {
        alert('Failed to clear logs: ' + (r.message || 'Unknown error'));
      }
    });

    refreshLogsBtn.addEventListener('click', () => {
      console.log('Refresh logs button clicked');
      loadLogs();
      loadErrors();
    });

    console.log('Control panel initialized');
    updateStatus();
    loadLogs();
    loadErrors();
    setInterval(updateStatus, 10000);
    setInterval(loadLogs, 10000);
    setInterval(loadErrors, 10000);
  </script>
</body>
</html>
