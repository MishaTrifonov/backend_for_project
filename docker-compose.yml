version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - PORT=3000
      - WS_PORT=8080
      - NODE_ENV=production
      - ALLOWED_ORIGINS=*
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - unity-network

networks:
  unity-network:
    driver: bridge
